spring:
  application:
    name: chatbot-rag-be
  
  profiles:
    include: sepay, gemini-local  # Added gemini-local for RAG

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/chatbot_db}  # Port 5433 for Docker PostgreSQL
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}  # Docker PostgreSQL password
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
  jpa:
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:50MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:50MB}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:anhphamle2002@gmail.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            trust: "*"
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  dev:
    hard-delete-enabled: ${DEV_HARD_DELETE_ENABLED:true}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    from-name: ${MAIL_FROM_NAME:Chatbot RAG Platform}
  server-url: ${APP_SERVER_URL:http://localhost:8080}

  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
    # old default: never
    # mode: never

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: true 
    hibernate:
      # ddl-auto: none
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # PHẢI ĐẶT Ở ĐÂY (THỤT VÀO 2 DẤU CÁCH SO VỚI SPRING)
  autoconfigure:
    exclude:
      - org.springframework.ai.model.google.genai.autoconfigure.chat.GoogleGenAiChatAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingAutoConfiguration

# Server configuration for proxy support (ngrok)
server:
  forward-headers-strategy: framework
  port: 8080

management:
  health:
    mail:
      enabled: false

# MinIO Configuration (S3-compatible object storage)
minio:
  enabled: true  # Đã có Docker, enable MinIO
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket-name: ${MINIO_BUCKET:chatbot-documents}
  tenant-assets-bucket: ${MINIO_TENANT_ASSETS_BUCKET:tenant-assets}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}

jwt:
  secret: ${JWT_SECRET:GSP26SE114_Super_Secret_Key_For_Internal_Chatbot_RAG_2026_FPTU}
  expiration: 86400000
  refreshExpiration: 604800000

# RAG smart chunking (ChunkingService): theo ký tự; spreadsheet-rows = số dòng dữ liệu / chunk (header luôn lặp lại)
rag:
  chunk-max-chars: ${RAG_CHUNK_MAX_CHARS:512}
  chunk-min-chars: ${RAG_CHUNK_MIN_CHARS:100}
  chunk-overlap-chars: ${RAG_CHUNK_OVERLAP_CHARS:64}
  spreadsheet-rows-per-chunk: ${RAG_SPREADSHEET_ROWS_PER_CHUNK:18}
  pdf-sparse-page-char-threshold: ${RAG_PDF_SPARSE_PAGE_CHARS:80}

embedding:
  # Default for SaaS/demo. Switch to "local" for on-premise POC.
  provider: ${EMBEDDING_PROVIDER:gemini}
  # DB vector dimension for current deployment mode (POC option B = re-create/re-embed when switching).
  storage-dimension: ${EMBEDDING_STORAGE_DIMENSION:768}
  chunk-failure-limit: ${EMBEDDING_CHUNK_FAILURE_LIMIT:5}
  startup-self-test: ${EMBEDDING_STARTUP_SELF_TEST:false}
  startup-self-test-text: ${EMBEDDING_STARTUP_SELF_TEST_TEXT:Kiểm tra embedding cục bộ cho tài liệu nội bộ}
  local:
    model-name: ${LOCAL_EMBEDDING_MODEL_NAME:mxbai-embed-large}
    fallback-models: ${LOCAL_EMBEDDING_FALLBACK_MODELS:}
    endpoint: ${LOCAL_EMBEDDING_ENDPOINT:http://localhost:11434/api/embed}
    api-key: ${LOCAL_EMBEDDING_API_KEY:}
    timeout-seconds: ${LOCAL_EMBEDDING_TIMEOUT_SECONDS:60}
    dimension: ${LOCAL_EMBEDDING_DIMENSION:1024}
    max-chars: ${LOCAL_EMBEDDING_MAX_CHARS:6000}

# ChiaseGPU (OpenAI-compatible) LLM provider
chiasegpu:
  base-url: ${CHIASEGPU_BASE_URL:https://llm.chiasegpu.vn/v1}
  api-key: ${CHIASEGPU_API_KEY:}
  models:
    flash: ts/gemini-2.5-flash
    pro: ts/gemini-3.1-pro
    embedding: tse/gemini/gemini-embedding-001
  embedding-dimension: ${EMBEDDING_STORAGE_DIMENSION:3072}

# Tier-based Gemini model selection
gemini:
  models:
    starter: ts/gemini-2.5-flash
    standard: ts/gemini-2.5-flash
    enterprise: ts/gemini-3.1-pro

# Enterprise VPS provisioning
enterprise:
  vps:
    admin-url: ${ENTERPRISE_VPS_ADMIN_URL:jdbc:postgresql://localhost:5435/postgres}
    admin-username: ${ENTERPRISE_VPS_ADMIN_USER:postgres}
    admin-password: ${ENTERPRISE_VPS_ADMIN_PASSWORD:}
    db-url-template: ${ENTERPRISE_VPS_DB_URL_TEMPLATE:jdbc:postgresql://localhost:5435/%s?TimeZone=UTC}
    db-name-prefix: ${ENTERPRISE_VPS_DB_PREFIX:enterprise_}

# Enterprise data backup (pg_dump via Docker postgres container)
backup:
  docker-container: ${BACKUP_DOCKER_CONTAINER:chatbot-postgres}
  pg-host: ${BACKUP_PG_HOST:host.docker.internal}
  pg-port: ${BACKUP_PG_PORT:5435}
